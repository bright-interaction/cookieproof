# CI for the public fair-code core (github.com/bright-interaction/cookieproof).
#
# THIS FILE IS DELIBERATELY THIN. Every actual check lives in scripts/ci.sh, which
# you can run yourself:
#
#   bash scripts/ci.sh
#
# Two reasons for the split. A contributor can reproduce CI locally instead of
# discovering a failure after pushing. And this repository is a filtered mirror
# published over a repository deploy key, which GitHub does not permit to create or
# update anything under .github/workflows/. Keeping the steps out of this file means
# a change to a check no longer breaks the publish at its final push.
#
# So: edit scripts/ci.sh freely. Editing THIS file is a rare, deliberate act (an
# action version bump, a trigger change) and needs a push from a credential holding
# the `workflow` scope.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    # Generous on purpose. The Rollup build alone is 19 bundles, each with its own
    # TypeScript program, and this number should never be the reason someone has to
    # edit this file (see the header for why that is expensive).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan reads the full history, not just the tip

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: All checks (deps, typecheck, tests, build, bundle size, secrets)
        run: bash scripts/ci.sh
