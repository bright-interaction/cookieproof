# gitleaks config for CookieProof (used by the public-mirror publish gate and any
# local scan). Extends the default ruleset, then allowlists documentation/config
# PLACEHOLDERS: .env.example uses obvious change-me markers, never real secrets. A
# real leaked credential would not carry these markers, so it is still caught.
title = "cookieproof"

[extend]
useDefault = true

[allowlist]
description = "Config placeholders use obvious markers, not real secrets"
regexes = [
  '''changeme''',
  '''change[_-]?me''',
  '''your_[a-z0-9_]*''',
  '''YOUR_[A-Z0-9_]*''',
  '''example\.com''',
  '''EXAMPLE''',
]
